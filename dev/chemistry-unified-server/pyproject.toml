[project]
name = "chemistry-unified-server"
version = "0.1.0"
description = "Unified Chemistry MCP Server integrating SMACT, Chemeleon, and MACE"
dependencies = [
    # Core package with tool implementations
    "crystalyse",
    # MCP framework
    # mcp 2.0 renamed mcp.server.fastmcp.FastMCP to
    # mcp.server.mcpserver.MCPServer; the servers here use the new path.
    # fastmcp (the separate package) is no longer needed.
    "mcp>=2.0.0,<3.0.0",
    "fastapi",
    "uvicorn",
    "python-multipart",
    # Chemistry libraries (also declared in crystalyse, but explicit here for clarity)
    "pymatgen",
    "ase",
    # Cap below 2.11 — torch 2.11 requires CUDA 13 drivers. See dev/pyproject.toml.
    "torch<2.11",
    "numpy",
    "smact",
    "mace-torch",
    # Pinned to v0.1.2 which includes fix for missing subpackages
    # chemeleon-dng 0.1.5+ ships complete subpackages on PyPI, so the git
    # dependency that worked around the broken 0.1.2 sdist is no longer
    # needed.  Installing from PyPI removes the git requirement at install
    # time.  NOTE: this is the generative structure model -- changing it can
    # change generated structures, so re-run any published case studies.
    "chemeleon-dng>=0.1.5,<0.2.0",
]

[project.scripts]
chemistry-unified-server = "chemistry_unified.server:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"] 