[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crystalyse"
version = "1.0.1"
description = "Crystalyse v1.0 - Intelligent Scientific AI Agent for Inorganic Materials Design"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Ryan Nduma", email = "ryannduma@gmail.com"},
]
maintainers = [
    {name = "Ryan Nduma", email = "ryannduma@gmail.com"},
]
keywords = [
    "materials-design",
    "crystal-structure-prediction",
    "formation-energy",
    "computational-materials-science",
    "ai-agents",
    "chemistry",
    "inorganic-materials",
    "autonomous-agents",
    "openai-agents",
    "mcp-servers",
    "provenance",
    "computational-honesty"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.11"
dependencies = [
    # Core AI and Agent Framework
    # Capped below 2.45 because openai 2.45.0 made ``cache_write_tokens`` a
    # required field on ``responses.InputTokensDetails``, while openai-agents
    # 0.13.6 still constructs ``InputTokensDetails(cached_tokens=0)`` in
    # agents/usage.py -- every Runner.run() raises a pydantic ValidationError
    # before the model is even called. Raise this ceiling only together with
    # the openai-agents pin below.
    # openai-agents 0.21+ requires the openai 3.x major line; litellm >=1.84
    # hard-caps openai<3 (and 1.83.1-1.83.14 pin it exactly), so litellm is
    # held at 1.83.0 -- the only release with an unbounded openai upper bound.
    # These three move together; see the litellm extra below.
    "openai>=3.0.0,<4",
    # Bumped to 0.22.0.  0.18.1 fixed the InputTokensDetails construction that
    # made every Runner.run() raise on openai>=2.45, so no openai cap is needed.
    "openai-agents>=0.22.0,<0.23",

    # Chemistry Core Libraries
    "pymatgen>=2024.1.0",
    "ase>=3.22.0",

    # AI-Powered Chemistry Tools
    # Capped below 4.0 because smact 4.0.0 replaced the ``include_zero`` /
    # ``consensus`` / ``commonality`` keywords of ``smact_validity`` with an
    # ``ICSD24FilterConfig`` object.  crystalyse/tools/smact/screening.py still
    # passes the 3.x keywords, so smact_validate_fast raises TypeError on 4.x.
    # Raise this ceiling only together with porting that call site.
    # smact 4.0 replaced the include_zero/consensus/commonality keywords of
    # smact_validity with an ICSD24FilterConfig object; the call site in
    # crystalyse/tools/smact/screening.py is ported to it.
    "smact>=4.0.0,<5.0.0",
    # Capped below 2.11: torch 2.11 bumped its CUDA runtime to 13.0, which
    # requires an NVIDIA driver new enough to support CUDA 13 (e.g. driver
    # 555+). Drivers pinned at CUDA 12.x — common on HPC / clusters — then
    # fall back silently to CPU and every Chemeleon / MACE call takes the
    # slow path. torch 2.10.x still ships cu12x wheels on PyPI and works on
    # any driver that supports CUDA >= 12.0, covering a much broader range
    # of real-world machines.
    "torch>=2.1.0,<2.11",
    "mace-torch>=0.3.0",
    # chemeleon-dng 0.1.5+ ships complete subpackages on PyPI, so the git
    # dependency that worked around the broken 0.1.2 sdist is no longer
    # needed.  Installing from PyPI removes the git requirement at install
    # time.  NOTE: this is the generative structure model -- changing it can
    # change generated structures, so re-run any published case studies.
    "chemeleon-dng>=0.1.5,<0.2.0",

    # Model Context Protocol
    "python-mcp>=1.0.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.23.0",
    "starlette>=0.27.0",

    # Data Processing
    "numpy>=1.24.0,<2.0.0",
    "pandas>=2.0.0",
    "scipy>=1.11.0",

    # Type Safety and Validation
    "typing-extensions>=4.5.0",
    "pydantic>=2.0.0",

    # CLI and UI
    "click>=8.1.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "prompt-toolkit>=3.0.0",

    # Async and Networking
    "asyncio>=3.4.3",
    "httpx>=0.24.0",
    "websockets>=11.0.0",
    "requests>=2.31.0",
    "tqdm>=4.66.0",

    # File and Data Handling
    "PyYAML>=6.0.0",
    "toml>=0.10.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
# Visualization capabilities
visualization = [
    "matplotlib>=3.7.0",
    "plotly>=5.18.0",
    "py3Dmol>=2.0.4",
    "kaleido>=0.2.1",
    "pymatviz>=0.8.5,<0.19.0",
    "seaborn>=0.12.0",
]

# Development tools
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.11.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "build>=1.0.0",
    "twine>=4.0.0",
]

# Multi-provider LLM support via LiteLLM
litellm = [
    # Pinned to exactly 1.83.0: it is the newest litellm whose openai
    # requirement (>=2.8.0, no upper bound) is satisfiable alongside
    # openai-agents 0.22's openai>=3.0.0.  1.83.1-1.83.14 pin openai==2.x
    # exactly and 1.84.0+ cap openai<3.0.0, so all of them conflict.
    # Verified live against Anthropic (Opus 5) via LitellmModel.
    "litellm==1.83.0",
]

# All optional dependencies
all = [
    "crystalyse[visualization,dev]",
]

[project.urls]
Homepage = "https://github.com/ryannduma/CrystaLyse.AI"
Documentation = "https://github.com/ryannduma/CrystaLyse.AI/tree/master/docs"
Repository = "https://github.com/ryannduma/CrystaLyse.AI.git"
Issues = "https://github.com/ryannduma/CrystaLyse.AI/issues"
Changelog = "https://github.com/ryannduma/CrystaLyse.AI/blob/master/CHANGELOG.md"

[project.scripts]
crystalyse = "crystalyse.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
license-files = []

[tool.setuptools.packages.find]
where = ["src"]
include = ["crystalyse*"]
exclude = ["tests*", "docs*", "*.egg-info"]

[tool.setuptools.package-data]
"crystalyse" = [
    "prompts/*.md",
    "prompts/*.txt",
]

# Code quality tools configuration
[tool.ruff]
line-length = 100
target-version = "py311"
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*" = ["S101", "ARG", "FBT"]

[tool.ruff.isort]
known-first-party = ["crystalyse"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
filterwarnings = [
    "error",
    "ignore::UserWarning",
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]
